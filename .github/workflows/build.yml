name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "*.md"
  workflow_dispatch: 

env:
  FLUTTER_VERSION: 3.38.6
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_CACHE: 'gradle'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Flutter
        uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get

      - name: Check Dart format
        run: |
          echo "Checking Dart code format..."
          if ! dart format --output=none --set-exit-if-changed lib; then
            echo ""
            echo "Some Dart files are not properly formatted."
            echo "Please run 'dart format lib' locally and commit the changes."
            exit 1
          fi

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

  build_android:
    name: Build Android
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.GRADLE_CACHE }}
      
      - name: Set up Flutter
        uses: subosito/flutter-action@0ca7a949e71ae44c8e688a51c5e7e93b2c87e295
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk 
      
