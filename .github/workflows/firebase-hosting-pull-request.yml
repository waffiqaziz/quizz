name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "*.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "*.md"
  workflow_dispatch: 

env:
  FLUTTER_VERSION: 3.47.2

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v7
      
      # Install Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Flutter dependencies setup
      - name: Install dependencies
        run: flutter pub get

      # Verify code formatting
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      
      # Run static analysis
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

  build_and_preview_web:
    name: Build and Preview Firebase Web
    needs: analyze
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v7

       # Node 24.17 (runner default) breaks the Firebase OAuth fetch; 24.18.0 fixes it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.18.0"
      
      # Install Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      
      # Verify Flutter installation
      - name: Flutter version
        run: flutter --version
  
      # Flutter dependencies setup
      - name: Install Flutter dependencies
        run: flutter pub get
      
      # Build the Flutter web project
      - name: Build Flutter Web
        run: flutter build web --release
        
      # 15.22.3 disables keep-alive in google-auth-library, fixing the same OAuth
      # break for service-account auth (firebase-tools#10716, nodejs/node#63989).
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUIZZ_FLUTTER_WEB }}
          projectId: quizz-flutter-web
          firebaseToolsVersion: "15.22.3"

  build_and_deploy:
    name: Build and Deploy Firebase Web
    needs: analyze
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - uses: actions/checkout@v7

      # Node 24.17 (runner default) breaks the Firebase OAuth fetch; 24.18.0 fixes it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24.18.0"

      # Install Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          
      # Verify Flutter installation
      - name: Verify Flutter installation
        run: flutter --version

      # Flutter dependencies setup
      - name: Install Flutter dependencies
        run: flutter pub get

      # Build the Flutter web project
      - name: Build Flutter Web
        run: flutter build web --release

      # 15.22.3 disables keep-alive in google-auth-library, fixing the same OAuth
      # break for service-account auth (firebase-tools#10716, nodejs/node#63989).
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUIZZ_FLUTTER_WEB }}
          channelId: live
          projectId: quizz-flutter-web
          firebaseToolsVersion: "15.22.3"
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
